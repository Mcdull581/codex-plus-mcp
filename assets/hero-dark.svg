  <rect width="1200" height="320" rx="20" fill="url(#glowCyan)"/>
  <rect width="1200" height="320" rx="20" fill="url(#glowViolet)"/>
  <rect x="1" y="1" width="1198" height="318" rx="19" fill="none" stroke="#334155" stroke-width="1.5"/>

